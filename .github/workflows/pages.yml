name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  portal-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/portal/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test accounts, tickets, and calculator
        run: node --test legal.test.cjs _pilot/tickets/accounts.test.cjs _pilot/tickets/domain.test.cjs _pilot/tickets/calculator.test.cjs
      - name: Assemble public files only
        run: |
          mkdir -p _site
          cp index.html styles.css script.js calculator-core.js robots.txt sitemap.xml CNAME _site/
          cp privacidad.html terminos.html legal.css _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: [build, portal-checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
