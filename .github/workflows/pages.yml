name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  portal-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/portal/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test accounts, tickets, and calculator
        run: node --test legal.test.cjs _pilot/tickets/accounts.test.cjs _pilot/tickets/domain.test.cjs _pilot/tickets/calculator.test.cjs
      - name: Assemble public files only
        run: |
          mkdir -p _site/assets
          cp index.html maintenance.css robots.txt CNAME _site/
          cp privacidad.html terminos.html legal.css _site/
          cp assets/logo-saldo-express-header.jpg _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [build, portal-checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
