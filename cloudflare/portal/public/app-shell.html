<!doctype html>
<html lang="es-NI">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Mi cuenta | Saldo Express</title>
    <link rel="icon" href="/logo.jpg" />
    <link rel="stylesheet" href="/portal.css" />
    <link rel="stylesheet" href="/app.css?v=20260930-2" />
    <script defer src="/lucide.min.js"></script>
    <script defer src="/calculator-core.js"></script>
    <script defer src="/accounts.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="workspace">
      <header class="app-header">
        <a class="brand" href="/" aria-label="Saldo Express">
          <img
            class="brand-logo"
            src="/logo.jpg"
            width="44"
            height="44"
            alt=""
          />
          <span class="brand-wordmark">Saldo<span>Express</span></span>
        </a>
        <nav id="navigation" aria-label="Secciones"></nav>
      </header>
      <div class="feedback-bar">
        <div id="toast" role="status" aria-live="polite"></div>
      </div>
      <main id="main" tabindex="-1"><p role="status">Cargando...</p></main>
      <footer>
        <button type="button" class="text-button" id="privacy-notice">
          Términos y privacidad
        </button>
        <span>Saldo Express · SoftOhm Systems LLC</span>
        <a href="https://wa.me/50586199889">Atención al cliente</a>
      </footer>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button
          id="close-dialog"
          class="icon-button"
          title="Cerrar"
          aria-label="Cerrar"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
  </body>
</html>
